<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">

<!-- ===== 要改目的地時，改這兩處（1/2）===== -->
<meta http-equiv="refresh" content="0; url=https://line.me/ti/p/kmYph4FjRl">

<title>轉導中</title>

<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #d8d8d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131313;
      --fg: #ededed;
      --muted: #9a9a9a;
      --line: #3a3a3a;
    }
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    text-align: center;
  }

  main { max-width: 22rem; }

  .spinner {
    width: 1.75rem;
    height: 1.75rem;
    margin: 0 auto 1.25rem;
    border: 2px solid var(--line);
    border-top-color: var(--fg);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--line); }
  }

  p { margin: 0; color: var(--muted); }

  a {
    color: inherit;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  a:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
    border-radius: 2px;
  }

  .fallback { margin-top: 1rem; }
</style>
</head>

<body>
<main>
  <div class="spinner" aria-hidden="true"></div>
  <p role="status">正在前往目的地</p>
  <p class="fallback">
    沒有自動跳轉的話，<a id="manual" href="https://line.me/ti/p/kmYph4FjRl">點這裡繼續</a>
  </p>
</main>

<script>
  // ===== 要改目的地時，改這兩處（2/2）=====
  var TARGET = "https://line.me/ti/p/kmYph4FjRl";

  document.getElementById("manual").href = TARGET;

  // 用 replace 而非 href：不留下這一頁的瀏覽記錄，
  // 使用者按「返回」時不會又被彈回這一頁。
  location.replace(TARGET);
</script>
</body>
</html>
